name: Bug
description: Something else is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: proctor version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Node version
    validations:
      required: true
