name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the checkout. Without an explicit block the token carries
# whatever the repository default grants, which on an older default is write access to everything.
permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        exclude:
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    # The suite runs in about two minutes locally and under five on the Linux and macOS runners.
    # Windows needs far longer: the bench tests junction in node_modules and spawn a vitest per
    # task, and the runner's on-access scanning makes each of those spawns cost minutes. The bound
    # exists so a genuine hang fails in under an hour instead of holding a runner for GitHub's
    # six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap

      - name: Test
        run: npm test

      - name: Validate Claude Code plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate ./plugin --strict
