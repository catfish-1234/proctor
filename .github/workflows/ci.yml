name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the checkout. Without an explicit block the token carries
# whatever the repository default grants, which on an older default is write access to everything.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        exclude:
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    # The suite runs in about two minutes locally and under five on the Linux and macOS runners.
    # Windows needs far longer: the bench tests junction in node_modules and spawn a vitest per
    # task, and the runner's on-access scanning makes each of those spawns cost minutes. The bound
    # exists so a genuine hang fails in under an hour instead of holding a runner for GitHub's
    # six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate Claude Code plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate ./plugin --strict

  # Aggregate gate. The branch ruleset on main requires a status context named "checks"; the
  # matrix job above only reports its expanded legs ("test (<os>, <node>)"), so this job reports
  # that context. It is not a rubber stamp: it runs after the matrix finishes, then verifies via
  # the API that every expected leg exists, completed, and concluded success. Any failed,
  # cancelled, skipped, or missing leg fails this job.
  checks:
    name: checks
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Verify every CI matrix leg succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/${SHA}/check-runs?per_page=100" > check-runs.json
          python3 <<'PY'
          import json, sys

          expected = {
              "test (ubuntu-latest, 20)",
              "test (ubuntu-latest, 22)",
              "test (macos-latest, 20)",
              "test (macos-latest, 22)",
              "test (windows-latest, 22)",
          }
          with open("check-runs.json") as f:
              runs = json.load(f)["check_runs"]
          # Keep the latest run per leg name so a retried leg is judged by its retry.
          latest = {}
          for run in sorted(runs, key=lambda r: r["id"]):
              if run["name"] in expected:
                  latest[run["name"]] = run
          missing = sorted(expected - set(latest))
          bad = sorted(
              "%s: status=%s conclusion=%s" % (name, run["status"], run["conclusion"])
              for name, run in latest.items()
              if run["status"] != "completed" or run["conclusion"] != "success"
          )
          for line in ["missing leg: %s" % n for n in missing] + bad:
              print(line)
          if missing or bad:
              sys.exit(1)
          print("All %d CI matrix legs completed successfully." % len(expected))
          PY
