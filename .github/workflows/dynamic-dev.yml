name: Dynamic development checks

on:
  pull_request:
    paths:
      - 'src/dynamic/**'
      - 'src/dynamic-worker.ts'
      - 'src/cli.ts'
      - 'tests/dynamic*.test.ts'
      - 'bench/dynamic-dev/*.mjs'
      - '.github/workflows/dynamic-dev.yml'

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap python3 git
          bwrap --ro-bind / / --unshare-net --unshare-pid --proc /proc --dev /dev -- true

      - name: Build
        run: npm ci && npm run build

      - name: Recheck tuned development cohorts
        run: node bench/dynamic-dev/recheck.mjs

      - name: Measure opt-in runtime cost
        run: |
          baseline="$RUNNER_TEMP/proctor-baseline"
          mkdir -p "$baseline"
          git archive b979148 src package.json tsconfig.json tsup.config.ts | tar -x -C "$baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          (cd "$baseline" && npm run build)
          node bench/dynamic-dev/measure-hardening.mjs "$baseline/dist/cli.js" > bench/dynamic-dev/hardening-runtime.json

      - name: Export tuned results
        run: |
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          for name in ['hardening-existing-results.json','hardening-judge-results.json','hardening-results.json','hardening-runtime.json']:
              content=Path('bench/dynamic-dev',name).read_bytes()
              print('PROCTOR_DEV_ARTIFACT '+json.dumps({'name':name,'content':base64.b64encode(content).decode()}))
          PY
