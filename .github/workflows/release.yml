name: Release

# Tag-triggered npm publish.
# Uses npm trusted publishing via GitHub OIDC (no stored long-lived token,
# automatic Sigstore provenance). NPM_TOKEN secret is a fallback for when
# the one-time npmjs.com trusted-publisher UI setup has not been completed
# (Package -> Settings -> Trusted Publisher on npmjs.com).
on:
  push:
    # Full versions only. The moving major tag Action users pin (v1, v2) is re-pointed after a
    # release and must not start a second publish.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      otp:
        description: "npm 2FA one-time password"
        required: false
        default: ""

# Least-privilege at the workflow level: do NOT grant id-token here.
# id-token: write is scoped to the publish job only.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release below
      id-token: write # Required for OIDC trusted publishing + automatic provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Every tag, so the publish step can tell whether this is the newest version.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # npm 10.x (shipped with node 22) does not support OIDC trusted publishing.
      # Requires npm >= 11.5.1. Pinned to a range rather than `latest` so a future npm major
      # cannot land unreviewed in the release path.
      - name: Upgrade npm for trusted publishing
        run: npm install -g "npm@^11.5.1"

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version under the right name,
      # and npm will not let that version number be reused afterwards. Cheaper to fail here.
      #
      # This runs unconditionally. Gating it on `startsWith(github.ref, 'refs/tags/v')` left the
      # workflow_dispatch path with no version check at all, so a dispatch from any branch could
      # publish whatever package.json happened to say.
      - name: Check the tag matches package.json
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "release runs from a v* tag; got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing version $PKG"

      - run: npm run build

      - run: npm test

      # The manifests that carry a version (plugin, Cursor, Gemini, Qwen, marketplace) are checked
      # against package.json by tests/distribution.test.ts, so a release cannot ship an npm package
      # and an agent plugin claiming different versions.
      - name: Verify the published tarball contents
        run: npm run verify:pack

      # OIDC trusted publishing is auto-detected when id-token: write is present AND npm >= 11.5.1,
      # but it can only authenticate a package that already exists, because the trusted publisher
      # is configured on the package's own settings page. So the FIRST publish needs NPM_TOKEN;
      # afterwards, configure the trusted publisher on npmjs.com and the secret can be deleted.
      #
      # The OTP is passed as a separate argument rather than interpolated into the command, so a
      # value containing a space or a glob character cannot become extra argv entries.
      #
      # --provenance signs the package with a Sigstore attestation tying it to this workflow run
      # and this commit. It needs id-token: write and a supported CI, both of which hold here, so
      # every tag-triggered release carries it. A publish run by hand from a laptop cannot.
      #
      # Only the newest version takes npm's `latest` dist-tag. A tag for an older version (a
      # backfilled release, or a run that finishes after a newer one) publishes under `legacy`,
      # so `npm install @kavishdua/proctor` can never be moved back to an old release by the
      # order in which workflow runs happen to finish. A prerelease publishes under `next`.
      # A version that is already on npm is skipped, so re-running a release is safe.
      - name: Publish to npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          HIGHEST="$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            "$HIGHEST") DIST_TAG=latest ;;
            *) DIST_TAG=legacy; echo "v$VERSION is older than v$HIGHEST, so it does not take the latest dist-tag." ;;
          esac
          npm publish --access public --provenance --tag "$DIST_TAG" ${NPM_OTP:+--otp="$NPM_OTP"}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OTP: ${{ github.event.inputs.otp }}

      # The tag is what a human looks for; leaving it without a release means the changelog entry
      # for this version is only findable by reading the repository. Idempotent, so re-running the
      # workflow for a tag that already has a release does not turn the job red after a good
      # publish.
      #
      # The notes are this version's CHANGELOG.md section. Only the newest version is marked as
      # the repository's latest release, for the same reason as the npm dist-tag above.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v version="$VERSION" '
            /^## \[/ { section = index($0, "## [" version "]") == 1; next }
            section { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md) for what changed." > "$NOTES_FILE"
          fi
          HIGHEST="$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          case "$VERSION" in
            *-*) FLAGS="--prerelease --latest=false" ;;
            "$HIGHEST") FLAGS="--latest" ;;
            *) FLAGS="--latest=false" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" $FLAGS
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" --verify-tag $FLAGS
          fi
