name: Release

# Tag-triggered npm publish.
# Uses npm trusted publishing via GitHub OIDC (no stored long-lived token,
# automatic Sigstore provenance). NPM_TOKEN secret is a fallback for when
# the one-time npmjs.com trusted-publisher UI setup has not been completed
# (Package -> Settings -> Trusted Publisher on npmjs.com).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      otp:
        description: "npm 2FA one-time password"
        required: false
        default: ""

# Least-privilege at the workflow level: do NOT grant id-token here.
# id-token: write is scoped to the publish job only.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release below
      id-token: write # Required for OIDC trusted publishing + automatic provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # npm 10.x (shipped with node 22) does not support OIDC trusted publishing.
      # Requires npm >= 11.5.1. Pinned to a range rather than `latest` so a future npm major
      # cannot land unreviewed in the release path.
      - name: Upgrade npm for trusted publishing
        run: npm install -g "npm@^11.5.1"

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version under the right name,
      # and npm will not let that version number be reused afterwards. Cheaper to fail here.
      #
      # This runs unconditionally. Gating it on `startsWith(github.ref, 'refs/tags/v')` left the
      # workflow_dispatch path with no version check at all, so a dispatch from any branch could
      # publish whatever package.json happened to say.
      - name: Check the tag matches package.json
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "release runs from a v* tag; got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "Publishing version $PKG"

      - run: npm run build

      - run: npm test

      # The manifests that carry a version (plugin, Cursor, Gemini, Qwen, marketplace) are checked
      # against package.json by tests/distribution.test.ts, so a release cannot ship an npm package
      # and an agent plugin claiming different versions.
      - name: Verify the published tarball contents
        run: npm run verify:pack

      # OIDC trusted publishing is auto-detected when id-token: write is present AND npm >= 11.5.1,
      # but it can only authenticate a package that already exists, because the trusted publisher
      # is configured on the package's own settings page. So the FIRST publish needs NPM_TOKEN;
      # afterwards, configure the trusted publisher on npmjs.com and the secret can be deleted.
      #
      # The OTP is passed as a separate argument rather than interpolated into the command, so a
      # value containing a space or a glob character cannot become extra argv entries.
      - name: Publish to npm
        run: |
          if [ -n "$NPM_OTP" ]; then
            npm publish --access public --otp="$NPM_OTP"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OTP: ${{ github.event.inputs.otp }}

      # The tag is what a human looks for; leaving it without a release means the changelog entry
      # for this version is only findable by reading the repository. Idempotent, so re-running the
      # workflow for a tag that already has a release does not turn the job red after a good
      # publish.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES" --verify-tag
          fi
