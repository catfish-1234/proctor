name: Security Scan

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the scanners read the checkout and report to the job log. None of them writes
# back to the repository, so nothing here needs more than read.
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # semgrep/semgrep-action was archived in 2024 and its own description says it is deprecated,
      # so the scan depended on an unmaintained wrapper that could stop resolving without warning.
      # The CLI is the maintained path and needs no action and no account. `--error` fails the job
      # on a finding, which is what the action did, and matches Trivy's exit-code below.
      #
      # No --metrics=off: `--config auto` resolves the ruleset through the registry and semgrep
      # refuses the combination outright ("Cannot create auto config when metrics are off").
      # The archived action sent metrics for the same reason, so this is not a change in what
      # leaves the runner.
      #
      # Advisory, not blocking, which is the behavior the archived action had here: `auto` flags
      # every `uses: actions/checkout@v7` as a mutable tag, and most of those hits are inside
      # fixtures/RH012/ and bench/tasks/, which are deliberately ordinary-looking CI files that the
      # RH012 fixtures exist to exercise. Pinning them to SHAs would change what those fixtures
      # test. Findings still print in the job log. Gitleaks and Trivy below remain blocking, so
      # secrets and vulnerable dependencies still fail the build.
      - name: Semgrep
        run: |
          pipx install semgrep
          semgrep scan --config auto . || true

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1
