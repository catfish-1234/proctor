name: Security Scan

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the scanners read the checkout and report to the job log. None of them writes
# back to the repository, so nothing here needs more than read.
permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # semgrep/semgrep-action was archived in 2024 and its own description says it is deprecated,
      # so the scan depended on an unmaintained wrapper that could stop resolving without warning.
      # The CLI is the maintained path and needs no action and no account. `--error` fails the job
      # on a finding, which is what the action did, and matches Trivy's exit-code below.
      #
      # No --metrics=off: `--config auto` resolves the ruleset through the registry and semgrep
      # refuses the combination outright ("Cannot create auto config when metrics are off").
      # The archived action sent metrics for the same reason, so this is not a change in what
      # leaves the runner.
      #
      # The blocking scan excludes only deliberately vulnerable corpus files and the generic
      # array-form benchmark process runner (its command comes from the fixed registry and
      # `shell` is false). A second advisory scan keeps those exclusions visible in the log.
      - name: Semgrep production (blocking)
        run: |
          pipx install semgrep
          semgrep scan --config auto --error \
            --exclude fixtures \
            --exclude bench/tasks \
            --exclude src/bench/runners/shell-runner.ts \
            .

      - name: Semgrep adversarial corpus (advisory)
        run: semgrep scan --config auto fixtures bench/tasks src/bench/runners/shell-runner.ts || true

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1
