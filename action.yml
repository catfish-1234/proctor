name: 'proctor'
description: 'Catch AI agents gaming their test suites. SARIF + Code Scanning'
author: 'Kavish Dua'
# Required by GitHub Marketplace publish validation, not just decoration: a listing without both
# an icon and a color is rejected. `icon` comes from the Feather v4.28.0 set.
branding:
  icon: 'shield'
  color: 'green'
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '20'
    # Build in the action's own checkout (github.action_path), not the consumer's workspace.
    # When this action is used from another repo, github.workspace is that repo and has no
    # proctor sources to build.
    - name: Build proctor
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci && npm run build
    - name: Determine diff base ref
      id: base
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        # Unshallow first: actions/checkout defaults to a 1-commit-deep clone, which
        # leaves no connecting history between HEAD and any other ref, so a later
        # `git diff base...HEAD` fails with "no merge base" even after fetching base.
        git fetch --no-tags --unshallow 2>/dev/null || true
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          echo "ref=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
        # A usable base has to exist AND share history with HEAD. `rev-parse --verify` only
        # answers the first half, and github.event.before fails the second after a force-push,
        # a rebase, or a squash-merge: the old head is still a real object the runner can fetch,
        # but it is no longer an ancestor of the new one, so `base...HEAD` has no merge base and
        # git rejects it as an invalid symmetric difference. Requiring a merge base falls back to
        # HEAD~1 in exactly those cases instead of failing the job on the first push after one.
        elif git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null 2>&1 \
             && git merge-base "${{ github.event.before }}" HEAD >/dev/null 2>&1; then
          echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
        else
          echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
        fi
    - name: Run proctor check
      shell: bash
      # --markdown writes to the job summary, which every repository can see. SARIF goes to Code
      # Scanning, which private repos only get with Advanced Security, so it cannot be the only
      # output or most users would see a bare pass/fail and no explanation of what proctor found.
      # --ci makes only error-severity findings fail the job. Without it a warning exits 1 and
      # fails the build, which is wrong for advisory findings: warnings are the tier proctor uses
      # precisely when it is not confident enough to block. They still appear in the job summary
      # and in Code Scanning, they just do not turn the build red on their own.
      run: node "${{ github.action_path }}/dist/cli.js" check --base "${{ steps.base.outputs.ref }}" --ci --sarif --markdown "$GITHUB_STEP_SUMMARY" > results.sarif
    - name: Upload SARIF to Code Scanning
      if: always()
      # Non-fatal: a repository without Code Scanning enabled fails this upload, and that must not
      # turn into a red X for a feature the user never asked for. The job summary above already
      # carried the findings, and the check step's own exit code already carried the verdict.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
      with:
        sarif_file: results.sarif
